<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bangkok Luxury Hotel</title>
    <base href="/" />

    <!-- Bootstrap ကို (CDN only) ပဲထားမယ် -->
    <!--<link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />-->

          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <!-- Custom styles -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/app_loading.css" />
    <link href="HotelManagementSystem_Web.styles.css" rel="stylesheet" />

    <!-- Icons and Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- PWA -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />

</head>

<body>

    <!-- New Loading screen when success -->
    <div id="hotel-loader">
        <div id="hotel-animation"></div>
        <div id="app-name">Bangkok Luxury Hotel</div>
        <div id="app-tagline">Experience the pinnacle of Thai hospitality</div>
        <div class="brand-mark">where memories are made</div>
        <div class="loading-progress">
            <div class="loading-progress-bar"></div>
        </div>
    </div>
    
    <div id="app">Loading...</div>

    <!-- Old loading screen when success -->
    <!--<div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>-->
    <!-- Blazor Loading Screen for error occur -->
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Lottie Animation Support -->
    <script src="https://unpkg.com/lottie-web@5.12.0/build/player/lottie.min.js"></script>

    <!-- I need to run this js before everything start because It has some actions -->
    <script src="js/app_loading.js"></script>

    <!-- Blazor WebAssembly Framework -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Bootstrap JS Bundle (includes Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>

    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!-- JavaScript Interop for Modals -->
    <script>
        window.confirm = function (message) {
            return window.confirm(message);
        };
    </script>

    <script>
        window.showBootstrapModal = (id) => {
            console.log("hit")
            const modalElement = document.querySelector(id);
            if (modalElement) {
                const modal = new bootstrap.Modal(modalElement);
                modal.show();
            }

        };

        window.hideBootstrapModal = (id) => {
            const modalElement = document.querySelector(id);
            if (modalElement) {
                const modalInstance = bootstrap.Modal.getInstance(modalElement);
                if (modalInstance) {
                    modalInstance.hide();
                }
            }
        };
    </script>

    <!-- Custom JS Files -->
    <script src="js/download.js"></script>
    <script src="chart/chart.js"></script>

</body>

</html>
